# =============================================================================
# HoverSpaceship — Central Game Configuration
# -----------------------------------------------------------------------------
# Every ship stat, module stat, level parameter, difficulty setting, and tuning
# coefficient lives here. Edit these values to rebalance the game without
# touching any TypeScript. All values are loaded at startup by
# src/constants/gameConfig.ts.
#
# Color values are given as hex strings (e.g. "#38bdf8"); their numeric form
# (colorHex / themeColorHex) is derived automatically in code.
# =============================================================================

# ---------------------------------------------------------------------------
# Level / sector progression
# ---------------------------------------------------------------------------
level:
  # Level 1 duration in seconds.
  baseDurationSec: 15
  # Hard cap: no sector ever lasts longer than this (seconds).
  maxDurationSec: 60
  # Piecewise progression: starting from baseDurationSec, each subsequent
  # sector adds `step` seconds until the running duration reaches `upTo`,
  # then the next stage takes over. The running value is clamped to each
  # stage's `upTo` so durations land on clean numbers.
  #   15 -> +1 up to 25 -> +2 up to 30 -> +4 up to 60 (max)
  durationStages:
    - upTo: 25
      step: 1
    - upTo: 30
      step: 2
    - upTo: 60
      step: 4

# ---------------------------------------------------------------------------
# Enemy interceptor spawning per sector level
# ---------------------------------------------------------------------------
enemy:
  # No enemies spawn before this level.
  startLevel: 2
  # Enemy count at startLevel.
  startCount: 2
  # Hard cap on the number of enemies in any single sector.
  countCap: 10
  # Level at which the enemy count reaches countCap. The count ramps linearly
  # from startCount (at startLevel) to countCap (at capLevel), then stays capped.
  capLevel: 15
  # Enemy variant types. `standard` always spawns; the others unlock at their
  # unlockLevel and each has a spawnChance (0-1) of replacing a standard drone.
  # sizeMultiplier / speedMultiplier are applied on top of the base drone stats.
  variants:
    heavy:
      # Bigger, slower interceptors. Unlocks at level 5.
      label: Heavy
      icon: "🛑"
      unlockLevel: 5
      spawnChance: 0.30
      sizeMultiplier: 1.28
      speedMultiplier: 0.68
      accentColor: "#fb923c"
    scout:
      # Half-size, 30% faster interceptors. Unlocks at level 10.
      label: Scout
      icon: "⚡"
      unlockLevel: 10
      spawnChance: 0.30
      sizeMultiplier: 0.5
      speedMultiplier: 1.3
      accentColor: "#a855f7"

# ---------------------------------------------------------------------------
# Moving asteroids — after this level, some obstacle formations drift up and
# down. Movers scroll relatively slowly at first and reach max vertical speed
# by maxSpeedLevel, in very small per-level increments. A moving formation
# carries fewer rocks (countScale), lowering the max asteroids on screen.
# ---------------------------------------------------------------------------
movingAsteroids:
  # Movers only start appearing AFTER this level (i.e. level > unlockLevel).
  unlockLevel: 5
  # Chance (0-1) that an eligible formation is a mover once unlocked.
  spawnChance: 0.4
  # Base vertical drift speed (world units / frame) = the "1x" reference.
  baseSpeed: 0.3
  # Speed multiplier the level after unlock (1x = baseSpeed).
  startMultiplier: 1
  # Speed multiplier once maxSpeedLevel is reached (3x = 3 * baseSpeed).
  maxMultiplier: 3
  # Level at which movers reach maxMultiplier. Ramps linearly between.
  maxSpeedLevel: 30
  # How far (world units) a mover drifts from its spawn line before turning back.
  travelRange: 90
  # Multiplier applied to a moving formation's asteroid count (fewer rocks).
  countScale: 0.55
  # Per-difficulty speed multiplier layered on top of the level ramp.
  difficultyMultipliers:
    easy: 1.0
    normal: 1.1
    hard: 1.2
    exhard: 1.3

# ---------------------------------------------------------------------------
# Bomb gems — disguised gems that morph into bombs. Colliding with one is
# harmful (breaks the shield, or is fatal without one).
# ---------------------------------------------------------------------------
bomb:
  # No bombs spawn before this level.
  startLevel: 3
  # Chance (percent) that a spawned gem is a bomb at startLevel.
  baseChancePct: 10
  # Added chance (percent) per subsequent level.
  chanceIncrementPct: 1
  # Hard cap on the bomb chance (percent).
  maxChancePct: 25

# ---------------------------------------------------------------------------
# Bonus "rift" sectors — an alternate reality the flight is pulled into after
# every `everyNLevels` normal sectors, instead of warping straight to the next
# one. A rift has no duration: it runs until the player is destroyed, ramping
# speed and enemy pressure the whole way, and it pays out double gems.
#
# Being destroyed inside a rift is NOT a run-ending death. The rift collapses,
# everything earned is kept, and the flight resumes at the normal sector it was
# heading to. Difficulty inside the rift is scaled off the sector the player had
# reached, so a rift at sector 20 is a sector-20-grade fight.
# ---------------------------------------------------------------------------
bonusLevel:
  # A rift opens after clearing every Nth sector (5 -> after 5, 10, 15, ...).
  everyNLevels: 5
  # Gem-cluster spawn passes per obstacle formation. 2 = twice the gems of a
  # normal sector in the same level range.
  gemSpawnMultiplier: 2
  # Length (seconds) of the rift warp-in and of the rift collapse warp-out.
  warpDurationSec: 4.0
  # Scroll speed added per second spent in the rift (a slow, relentless ramp).
  speedRampPerSec: 0.02
  # Ceiling on that added speed, so the rift stays survivable indefinitely.
  maxSpeedRamp: 4.0
  # Obstacle spawn-interval tightening (frames) per second spent in the rift.
  spawnIntervalRampPerSec: 0.35
  # Floor for the rift's obstacle spawn interval (frames). Tighter than the
  # 55-frame floor normal sectors clamp to, so rifts get genuinely dense.
  minSpawnInterval: 42
  # Seconds between enemy spawns the moment the rift opens.
  enemyIntervalStartSec: 9.0
  # Shortest the enemy spawn interval ever gets (seconds).
  enemyIntervalMinSec: 2.2
  # How much the enemy spawn interval shortens per second spent in the rift.
  enemyIntervalRampPerSec: 0.06
  # Alternate-reality accent: near stars, warp streaks and the rift ring tunnel.
  themeColor: "#c084fc"
  # Deep-space fog colour inside a rift (normal space is a near-black #010208).
  fogColor: "#170a2e"

# ---------------------------------------------------------------------------
# Ship module addons (in-run only; purchased from the Shop with gems)
# ---------------------------------------------------------------------------
modules:
  # Maximum tier any module can reach.
  maxTier: 5
  # Power Generator: delay (seconds) before a broken shield regenerates, per tier.
  shieldRegenDelaysSec: [15, 13, 11, 9, 8]
  # Auto Cannon: reload time (seconds) between shots, per tier.
  autoCannonReloadSec: [20, 18, 15, 12, 10]
  # Reflect Capacitor: extra reflect-shell charges granted, per tier.
  # Added to the hull's own rating *before* the hull's shieldChargeMultiplier,
  # so the Titan Dreadnought's +50% special scales with the module.
  shieldChargeBonuses: [1, 2, 3, 4, 5]
  # Scanner Array: extra viewing distance (percent) revealed ahead, per tier.
  # Each tier widens the horizontal view and peels back the right-side fog of
  # war without changing the vertical framing.
  scannerExtraDistancePct: [5, 10, 15, 20, 25]
  # Gem cost to purchase each successive tier (index 0 = cost to reach tier 1).
  upgradeCosts: [20, 30, 45, 65, 90]
  # Presentation metadata for the shop UI.
  meta:
    powerGen:
      name: Power Generator
      icon: "🛡️"
      blurb: Regenerates your reflect shield after it breaks.
      unit: s regen
    autoCannon:
      name: Auto Cannon
      icon: "🔫"
      blurb: Automatically targets and destroys enemy interceptors.
      unit: s reload
    zoomScanner:
      name: Scanner Array
      icon: "🛰️"
      blurb: Widens your sensor range, burning back the fog of war ahead.
      unit: "% range"
    shieldCell:
      name: Reflect Capacitor
      icon: "🔋"
      blurb: Stacks extra charges onto your reflect shell.
      unit: " charges"

# ---------------------------------------------------------------------------
# Difficulty & progression scaling coefficients
# ---------------------------------------------------------------------------
difficultyAlgorithm:
  # Score interval required for a speed increase.
  scoreStepForSpeed: 10
  # Speed bonus multiplier applied per score step.
  scoreSpeedMultiplier: 0.04
  # Speed bonus added per sector level.
  levelSpeedBonus: 0.06
  # Obstacle gap reduction per sector level.
  levelGapReduction: 4
  # Spawn-interval tightening (frames) per sector level.
  levelSpawnIntervalReduction: 2
  # Score-based spawn-interval tightening factor.
  scoreSpawnReductionFactor: 0.6

# ---------------------------------------------------------------------------
# Level simulation / preview coefficients
# ---------------------------------------------------------------------------
simulation:
  # Approximate frame rate used to estimate obstacle counts.
  framesPerSec: 60
  # Tightest possible obstacle spawn interval (matches the clamp in GameEngine).
  minSpawnInterval: 55

# ---------------------------------------------------------------------------
# Ship models (stats + hangar presentation)
#
# Per-ship specials are opt-in: any ship that omits a special key inherits the
# baseline from `shipDefaults` below.
#   shieldCharges - impacts the reflect shell can absorb before it breaks.
#                   Designed to be upgradable later (a module can add charges
#                   on top of the hull's own rating).
#   shieldChargeMultiplier
#                 - scales the hull's charge rating *after* any module bonus has
#                   been added, then rounds up. A 1.5 multiplier therefore reads
#                   as "+50% shields": 1 -> 2, 2 -> 3, 3 -> 5, 4 -> 6.
#   trueVision    - disguised bombs never morph back into their gem disguise.
#                   Also intended to become a purchasable module perk.
# ---------------------------------------------------------------------------
shipDefaults:
  shieldCharges: 1
  shieldChargeMultiplier: 1.0
  trueVision: false

ships:
  dart:
    name: Spectre Dart
    tagline: Standard Recon Scout
    cost: 0
    sizeScale: 1.0
    speed: 7.0
    smoothness: 0.13
    sizeLabel: 1.0x Standard
    speedLabel: 7.0 Mach
    reactivityLabel: High (0.13)
    sizeStars: 3
    speedStars: 3
    reactivityStars: 3
  viper:
    name: Nebula Viper
    tagline: Compact Micro Interceptor
    cost: 60
    sizeScale: 0.7
    speed: 8.0
    smoothness: 0.18
    sizeLabel: 0.70x Micro
    speedLabel: 8.0 Mach
    reactivityLabel: Ultra (0.18)
    sizeStars: 5
    speedStars: 4
    reactivityStars: 5
  titan:
    name: Titan Dreadnought
    tagline: Heavy Armored Cruiser
    cost: 135
    sizeScale: 1.25
    speed: 5.5
    smoothness: 0.08
    sizeLabel: 1.25x Heavy
    speedLabel: 5.5 Mach
    reactivityLabel: Steady (0.08)
    sizeStars: 1
    speedStars: 1
    reactivityStars: 1
    # Special: reinforced reflect shell carries half again as many charges as
    # the rest of the fleet, rounded up, so module bonuses scale with it too.
    shieldChargeMultiplier: 1.5
    special: Reinforced Reflect — +50% shield charges (rounded up)
  phantom:
    name: Pulse Oracle
    tagline: True-Sight Warp Core
    cost: 225
    sizeScale: 0.92
    speed: 7.5
    smoothness: 0.11
    sizeLabel: 0.92x Compact
    speedLabel: 7.5 Mach
    reactivityLabel: Fluid (0.11)
    sizeStars: 4
    speedStars: 3
    reactivityStars: 2
    # Special: onboard scanner locks bombs into their revealed red form.
    trueVision: true
    special: True Sight — disguised bombs stay revealed as bombs
  valkyrie:
    name: Solar Valkyrie
    tagline: Legendary Solar Flagship
    cost: 360
    sizeScale: 1.06
    speed: 8.6
    smoothness: 0.16
    sizeLabel: 1.06x Flagship
    speedLabel: 8.6 Mach
    reactivityLabel: Hyper (0.16)
    sizeStars: 2
    speedStars: 5
    reactivityStars: 4

# ---------------------------------------------------------------------------
# Difficulty settings (themeColorHex is derived from themeColor)
#
# shieldChargeBonus - extra reflect-shell charges the difficulty hands the pilot,
#                     summed with any Reflect Capacitor bonus *before* the hull's
#                     shieldChargeMultiplier, so ship specials still scale with
#                     it. Omitted means 0.
# blurb             - one-line summary of what this difficulty changes, shown
#                     under the difficulty picker and in the sector simulator.
#                     Phrased relative to NORMAL, which is the baseline. Keep it
#                     in sync with the numbers above when rebalancing.
# ---------------------------------------------------------------------------
difficulties:
  easy:
    label: EASY
    baseSpeed: 1.6
    speedIncrement: 0.04
    baseGap: 260
    minGap: 210
    oscillateChance: 0.0
    spawnInterval: 160
    themeColor: "#22c55e"
    themeGlow: rgba(34, 197, 94, 0.4)
    # Training wheels: one free extra reflect charge on every hull.
    shieldChargeBonus: 1
    # Free tier-1 Auto Cannon fitted from the start of every run.
    startAutoCannonLevel: 1
    blurb: Slowest scroll, widest gaps and the thinnest rock fields. Nothing sways and drifting rocks are at their slowest.
  normal:
    label: NORMAL
    baseSpeed: 2.1
    speedIncrement: 0.06
    baseGap: 235
    minGap: 185
    oscillateChance: 0.2
    spawnInterval: 140
    themeColor: "#38bdf8"
    themeGlow: rgba(56, 189, 248, 0.4)
    # Free tier-1 Auto Cannon fitted from the start of every run.
    startAutoCannonLevel: 1
    blurb: The baseline run. Steady scroll, standard gaps, and 1 in 5 formations sways.
  hard:
    label: HARD
    baseSpeed: 2.6
    speedIncrement: 0.08
    baseGap: 210
    minGap: 160
    oscillateChance: 0.4
    spawnInterval: 120
    themeColor: "#ef4444"
    themeGlow: rgba(239, 68, 68, 0.4)
    blurb: Quicker scroll, tighter gaps and denser fields. 2 in 5 formations sway and drifting rocks pick up pace.
  exhard:
    label: EX-HARD
    baseSpeed: 3.2
    speedIncrement: 0.10
    baseGap: 190
    minGap: 140
    oscillateChance: 0.6
    spawnInterval: 105
    themeColor: "#c084fc"
    themeGlow: rgba(192, 132, 252, 0.5)
    blurb: Top scroll speed, narrowest gaps and the densest fields. 3 in 5 formations sway and drifting rocks are fastest.

